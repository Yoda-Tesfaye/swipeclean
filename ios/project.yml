name: SwipeClean

options:
  bundleIdPrefix: com.swipeclean
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: "1.8.3"
    CURRENT_PROJECT_VERSION: "12"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    SWIFT_OPTIMIZATION_LEVEL: "-Osize"
    SWIFT_COMPILATION_MODE: wholemodule

targets:
  SwipeClean:
    type: application
    platform: iOS
    sources:
      - path: SwipeClean
    settings:
      base:
        PRODUCT_NAME: SwipeClean
        PRODUCT_BUNDLE_IDENTIFIER: com.swipeclean.app
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
    dependencies:
      - sdk: Photos.framework
      - sdk: AVFoundation.framework
      - sdk: UIKit.framework

schemes:
  SwipeClean:
    build:
      targets:
        SwipeClean: all
    run:
      config: Debug
    archive:
      config: Release









